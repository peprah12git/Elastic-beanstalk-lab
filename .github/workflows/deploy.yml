name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897722679541:role/github-actions-eb-role
          aws-region: eu-north-1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Set version label
        id: version
        run: echo "label=v-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Zip JAR and Procfile
        run: |
            cp Procfile target/
            cd target
            zip ../app.zip notebook-0.0.1-SNAPSHOT.jar Procfile

      - name: Debug zip contents
        run: unzip -l app.zip

      - name: Upload bundle to S3
        run: |
          aws s3 cp app.zip s3://elasticbeanstalk-eu-north-1-897722679541/${{ steps.version.outputs.label }}.zip

      - name: Create new EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --version-label ${{ steps.version.outputs.label }} \
            --source-bundle S3Bucket="elasticbeanstalk-eu-north-1-897722679541",S3Key="${{ steps.version.outputs.label }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-name ${{ secrets.EB_ENV_NAME }} \
            --version-label ${{ steps.version.outputs.label }}

      - name: Wait for deployment to complete
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }}

      - name: Verify deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }} \
            --query "Environments[0].{Status:Status,Health:Health,Version:VersionLabel}" \
            --output table